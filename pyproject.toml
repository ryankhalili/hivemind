[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind"
version = "0.3.0"
description = "A personal AI coordinator with connected device tools"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "cryptography>=43"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["hivemind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
